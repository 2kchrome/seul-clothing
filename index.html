<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a12">
<title>Seul</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#07130d;--card:#0d2017;--raise:#143022;--ice:#fff8ef;--text:#b9cbbf;--muted:#7f988a;--line:#1c3a2a;--line2:#2c5640;--red:#d7263d;--gold:#f2c14e;--blue:#f2c14e;
  box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:dark;scroll-behavior:smooth}*{box-sizing:border-box;margin:0}
body{background:radial-gradient(ellipse at top,#10301f 0,var(--bg) 60%) fixed;color:var(--text);font:400 15px/1.55 'Instrument Sans',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#snow{position:fixed;inset:0;pointer-events:none;z-index:50}
.sale{background:repeating-linear-gradient(45deg,var(--red) 0 18px,#b81d32 18px 36px);color:#fff;text-align:center;font-weight:600;font-size:14px;letter-spacing:.04em;padding:calc(9px + env(safe-area-inset-top,0px)) 16px 9px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(16px,4vw,48px);border-bottom:2px solid var(--gold)}
.logo{display:flex;align-items:center;gap:9px;color:var(--ice);font-weight:600;font-size:16px}
.logo img{height:30px;width:auto;max-width:56vw;object-fit:contain;display:block}
@media(min-width:700px){.logo img{height:36px}}
.contact{font-size:14px;color:var(--ice);text-decoration:none;border:1px solid var(--gold);padding:7px 14px;border-radius:999px;transition:background .15s}
a.contact:hover{background:var(--raise)}
.wrap{max-width:1100px;margin:0 auto;padding:56px clamp(16px,4vw,28px) 40px}
h1{font-size:clamp(44px,8vw,84px);font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--ice)}
h1 span{color:var(--red)}
.sub{margin-top:16px;max-width:580px;font-size:16px}.sub b{color:var(--ice);font-weight:500}
.deal{margin-top:20px;display:inline-block;background:var(--red);color:#fff;font-weight:600;font-size:18px;padding:10px 20px;border-radius:12px;border:2px dashed var(--gold);transform:rotate(-1.5deg)}
.notice{margin-top:22px;display:inline-flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--card)}
.notice b{color:var(--ice);font-weight:500}
.bar{position:sticky;top:0;z-index:5;background:rgba(7,19,13,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) clamp(16px,4vw,28px) 12px}
.bar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;flex:none;font-size:14px;color:var(--text);padding:7px 14px;border-radius:999px;border:1px solid var(--line2);transition:all .15s}
.chip:hover{color:var(--ice);border-color:var(--gold)}
.chip[aria-pressed=true]{background:var(--red);color:#fff;border-color:var(--red);font-weight:500}
.chip small{font-size:12px;opacity:.7;margin-left:5px}
select{flex:none;background:var(--card);color:var(--ice);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin-top:32px}
.item{border:1px solid var(--line);background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s}
.item:hover{border-color:var(--gold)}
.pic{aspect-ratio:4/5;position:relative;background:#050f0a}
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;height:100%;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;display:block}
.arrow{all:unset;cursor:pointer;position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:rgba(7,19,13,.8);border:1px solid var(--line2);color:var(--ice);display:grid;place-items:center;font-size:18px;line-height:1;opacity:0;transition:opacity .15s}
.pic:hover .arrow,.arrow:focus-visible{opacity:1}
@media(hover:none){.arrow{opacity:.9}}
.arrow.l{left:10px}.arrow.r{right:10px}
.num{position:absolute;bottom:10px;right:10px;font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(7,19,13,.85);color:var(--ice);border:1px solid var(--line2)}
.tag{position:absolute;top:10px;left:10px;font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(7,19,13,.85);color:var(--text);border:1px solid var(--line2)}
.off{position:absolute;top:10px;right:10px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--red);color:#fff}
.info{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.info b{color:var(--ice);font-weight:500;font-size:16px;line-height:1.3}
.pr{flex:none;text-align:right;white-space:nowrap}
.price{color:var(--gold);font-weight:600;font-size:18px}
.was{display:block;color:var(--muted);font-size:13px;text-decoration:line-through}
.buy{margin:6px 16px 16px;text-align:center;text-decoration:none;color:var(--ice);font-size:14px;font-weight:500;padding:9px;border-radius:10px;border:1px solid var(--line2);transition:all .15s}
.buy:hover{background:var(--red);color:#fff;border-color:var(--red)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
footer{max-width:1100px;margin:0 auto;padding:30px 20px 56px;text-align:center;font-size:13px;color:var(--muted)}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.info{flex-direction:column;gap:2px;padding:12px 12px 6px}.pr{text-align:left}.buy{margin:6px 12px 12px}.price{font-size:16px}.info b{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}#snow{display:none}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="sale" id="sale"></div>
<header>
  <div class="logo"><img src="logo.png" alt="Shop logo" width="189" height="30"></div>
  <span id="contact" class="contact"></span>
</header>

<main>
  <div class="wrap" style="padding-bottom:36px">
    <h1>The <span>rack</span> 🎄</h1>
    <p class="sub" id="how"></p>
    <div class="deal">🎁 $5 OFF every item this Christmas</div><br>
    <p class="notice" id="meta"></p>
  </div>
  <div class="bar"><div class="bar-in">
    <div class="chips" id="chips" role="group" aria-label="Categories"></div>
    <select id="sort" aria-label="Sort items">
      <option value="">Featured</option>
      <option value="asc">Price: low to high</option>
      <option value="desc">Price: high to low</option>
    </select>
  </div></div>
  <div class="wrap" style="padding-top:0"><div class="grid" id="grid"></div></div>
</main>
<footer id="foot">Happy holidays from SEUL ❄️</footer>

<script src="products.js"></script>
<script>
var SHOP={},ITEMS=[];
var $=function(id){return document.getElementById(id)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function safe(u){try{var x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}}
function placeholder(){
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="#0a1a12"/><text x="200" y="256" font-family="sans-serif" font-size="20" fill="#7f988a" text-anchor="middle">Photo coming soon</text></svg>';
  return 'data:image/svg+xml,'+encodeURIComponent(s)}
function imgSrc(u){u=u||'';return safe(u)||(/^data:image\//.test(u)?u:placeholder())}

function init(data){
SHOP=data.shop;ITEMS=data.items;
document.title=SHOP.name+' · Christmas Sale';
$('sale').textContent='🎄 '+(SHOP.saleText||'$5 OFF ALL ITEMS')+' 🎁';
var link=safe(SHOP.contactLink),c=$('contact');
if(link){var a=el('a','contact',SHOP.contactLabel+': '+SHOP.contactHandle);a.href=link;a.target='_blank';a.rel='noopener noreferrer';c.replaceWith(a)}
else c.textContent=SHOP.contactLabel+': '+SHOP.contactHandle;

var how=$('how');how.append('Everything is available in all sizes and colors. Ordering? Message me on '+SHOP.contactLabel+' at ');
how.appendChild(el('b','',SHOP.contactHandle));how.append(' with what you want.');
var meta=$('meta');meta.appendChild(el('span','','Payment:'));meta.appendChild(el('b','',SHOP.payment));
var note=el('p','notice','Images are not final. Designs are altered to prevent bot purchases.');note.style.marginLeft='8px';
$('how').parentNode.appendChild(note);

var active='All',g=$('grid'),chips=$('chips');
var cats=['All'];ITEMS.forEach(function(it){var k=it.cat||'Other';if(cats.indexOf(k)<0)cats.push(k)});
function count(k){return k==='All'?ITEMS.length:ITEMS.filter(function(i){return (i.cat||'Other')===k}).length}

function card(it){
  var imgs=(it.images&&it.images.length)?it.images:[''],c=el('div','item'),pic=el('div','pic'),strip=el('div','strip');
  imgs.forEach(function(u){var im=el('img');im.src=imgSrc(u);im.alt=it.name;im.loading='lazy';im.onerror=function(){im.onerror=null;im.src=placeholder()};strip.appendChild(im)});
  pic.appendChild(strip);pic.appendChild(el('span','tag',it.cat||'Other'));
  if(it.was)pic.appendChild(el('span','off','$'+(it.was-it.price)+' OFF'));
  if(imgs.length>1){
    var n=el('span','num','1 / '+imgs.length);
    var l=el('button','arrow l','‹'),r=el('button','arrow r','›');
    l.type=r.type='button';l.setAttribute('aria-label','Previous photo');r.setAttribute('aria-label','Next photo');
    l.onclick=function(){strip.scrollBy({left:-strip.clientWidth,behavior:'smooth'})};
    r.onclick=function(){strip.scrollBy({left:strip.clientWidth,behavior:'smooth'})};
    strip.addEventListener('scroll',function(){n.textContent=(Math.round(strip.scrollLeft/strip.clientWidth)+1)+' / '+imgs.length});
    pic.appendChild(l);pic.appendChild(r);pic.appendChild(n);
  }
  c.appendChild(pic);
  var inf=el('div','info'),pr=el('span','pr');inf.appendChild(el('b','',it.name));
  pr.appendChild(el('span','price','$'+it.price));
  if(it.was)pr.appendChild(el('span','was','$'+it.was));
  inf.appendChild(pr);c.appendChild(inf);
  if(link){var b=el('a','buy','Order on '+SHOP.contactLabel);b.href=link;b.target='_blank';b.rel='noopener noreferrer';c.appendChild(b)}
  return c}

function render(){
  var list=ITEMS.filter(function(i){return active==='All'||(i.cat||'Other')===active});
  var s=$('sort').value;
  if(s)list=list.slice().sort(function(a,b){return s==='asc'?a.price-b.price:b.price-a.price});
  g.textContent='';
  if(!list.length)g.appendChild(el('div','empty','Nothing here yet. Check back soon.'));
  list.forEach(function(it){g.appendChild(card(it))})}

cats.forEach(function(k){
  var b=el('button','chip',k);b.type='button';b.setAttribute('aria-pressed',k===active);
  b.appendChild(el('small','',count(k)));
  b.onclick=function(){active=k;[].forEach.call(chips.children,function(x){x.setAttribute('aria-pressed',x===b)});render()};
  chips.appendChild(b)});
$('sort').onchange=render;
render();
}
init(PRODUCTS);

/* Snowfall */
(function(){
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var cv=$('snow'),x=cv.getContext('2d'),W,H,fl=[];
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  size();addEventListener('resize',size);
  for(var i=0;i<70;i++)fl.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.5+.8,v:Math.random()*.8+.4,d:Math.random()*Math.PI*2});
  (function tick(){
    x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.8)';
    fl.forEach(function(f){f.y+=f.v;f.d+=.01;f.x+=Math.sin(f.d)*.5;
      if(f.y>H){f.y=-5;f.x=Math.random()*W}
      x.beginPath();x.arc(f.x,f.y,f.r,0,6.283);x.fill()});
    requestAnimationFrame(tick)})();
})();
</script>
</body>
</html>
